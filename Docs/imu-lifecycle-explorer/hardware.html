<div class="top"><div class="brand"><span>GETFUN</span>飞控硬件实验室</div><small>ICM42688P × STM32F722</small></div>
<header><div><h1>看见一帧 IMU 数据，如何被搬运</h1><p>芯片位置不变。观察字节经过哪根线、落在哪块内存，以及 CPU 何时接手。</p></div><div class="legend"><span><i></i>采样数据 / RX</span><span><i class="tx"></i>命令与填充 / TX</span><span><i class="ctrl"></i>配置与中断</span></div></header>
<main><section class="stage" aria-label="IMU 与 STM32 内部硬件的数据传递示意"><div class="stage-head"><span><strong id="sceneLabel"></strong> · <span id="stageNumber"></span></span><span>点击芯片或下方章节查看解说 · 播放后观察移动字节</span></div>
<svg class="drawing" id="hardware" viewBox="0 0 1440 720" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">IMU、SPI1、DMA2、SRAM 与 CPU 之间的数据传递</title><desc id="svgDesc">左侧传感器通过四根线连接 STM32。黄色代表 TX，蓝色代表 RX，紫色虚线代表配置和中断。下方章节按钮提供同等操作。</desc></svg>
